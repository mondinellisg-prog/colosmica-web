collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "home"
        label: "Página Principal"
        file: "index.html"
        format: "frontmatter"
        fields:
          # --- SECCIÓN HERO ---
          - name: "hero"
            label: "Bloque de Inicio (Hero)"
            widget: "object"
            fields:
              - {label: "Título Grande", name: "title", widget: "string"}
              - {label: "Subtítulo", name: "subtitle", widget: "string"}
              - {label: "Imagen de Fondo", name: "image", widget: "image"}

          # --- SECCIÓN SERVICIOS (Lista repetible) ---
          - name: "servicios"
            label: "Nuestros Servicios"
            widget: "list" # <--- Esto permite al cliente agregar 1, 2, 10 servicios
            fields:
              - {label: "Nombre del Servicio", name: "nombre", widget: "string"}
              - {label: "Descripción", name: "desc", widget: "text"}
              - {label: "Icono/Imagen", name: "icono", widget: "image"}

          # --- SECCIÓN CONTACTO ---
          - name: "contacto"
            label: "Datos de Contacto"
            widget: "object"
            fields:
              - {label: "WhatsApp", name: "tel", widget: "string"}
              - {label: "Email", name: "mail", widget: "string"}
