backend:
  name: github
  repo: mondinellisg-prog/colosmica-web
  branch: main
 

media_folder: "assets"
public_folder: "assets"

site_url: https://colosmica-web.pages.dev

collections:
  - name: "contenido"
    label: "Contenido de la Web"
    files:
      - name: "data"
        label: "Datos del Sitio"
        file: "data.json"
        fields:
          # --- HERO ---
          - name: "hero"
            label: "Portada (Hero)"
            widget: "object"
            required: false
            fields:
              - {label: "Subtítulo", name: "subtitle", widget: "string", required: false}
              - {label: "Texto Botón", name: "btn_text", widget: "string", required: false}
              - {label: "Link Botón", name: "btn_link", widget: "string", required: false}
              - {label: "Imagen de Fondo", name: "bg_image", widget: "image", required: false}

          # --- NOVEDADES ---
          - name: "news"
            label: "Sección Novedades"
            widget: "list"
            required: false
            fields:
              - {label: "Título Noticia", name: "title", widget: "string", required: false}
              - {label: "Fecha", name: "date", widget: "string", required: false}
              - {label: "Bajada / Resumen", name: "excerpt", widget: "text", required: false}
              - {label: "Foto", name: "image", widget: "image", required: false}

          # --- BIO ---
          - name: "bio"
            label: "Sección Biografía"
            widget: "object"
            required: false
            fields:
              - {label: "Texto Principal", name: "text", widget: "markdown", required: false}
              - {label: "Foto de la Banda", name: "image", widget: "image", required: false}

          # --- SHOWS ---
          - name: "shows"
            label: "Próximos Shows"
            widget: "list"
            required: false
            fields:
              - {label: "Día (Ej: 31 ENE)", name: "date", widget: "string", required: false}
              - {label: "Lugar", name: "venue", widget: "string", required: false}
              - {label: "Ciudad", name: "city", widget: "string", required: false}
              - {label: "Link Reservas", name: "link", widget: "string", required: false}

          # --- VIDEOS ---
          - name: "videos"
            label: "Carrusel de Videos"
            widget: "list"
            required: false
            fields:
              - {label: "ID Youtube (su8w3fQJ-Sc)", name: "id", widget: "string", required: false}

          # --- TIENDA ---
          - name: "shop"
            label: "Tienda / Productos"
            widget: "list"
            required: false
            fields:
              - {label: "Nombre", name: "name", widget: "string", required: false}
              - {label: "Etiqueta", name: "tag", widget: "string", required: false}
              - {label: "Precio", name: "price", widget: "string", required: false}
              - {label: "WhatsApp link", name: "link", widget: "string", required: false}
