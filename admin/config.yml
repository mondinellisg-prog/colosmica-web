backend:
  name: github
  repo: mondinellisg-prog/colosmica-web
  branch: main

# Esto permite que Sveltia se autentique sin servidores externos
media_folder: "assets" 
public_folder: "/assets"

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "home"
        label: "Página Principal"
        file: "index.html"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Texto", name: "body", widget: "markdown"}
