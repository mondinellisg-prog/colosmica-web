backend:
  name: github
  repo: mondinellisg-prog/colosmica-web # Tu repositorio
  branch: main
  auth_type: pkce # <-- ESTA ES LA LÍNEA MÁGICA

media_folder: "" 
public_folder: ""

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "home"
        label: "Página Principal (Index)"
        file: "index.html"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Texto", name: "body", widget: "markdown"}
