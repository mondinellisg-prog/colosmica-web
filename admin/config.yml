backend:
  name: github
  repo: mondinellisg-prog/colosmica-web
  branch: main
  auth_type: pkce
  app_id: Ov23liuVdtEfaXovkr7N

# Sveltia necesita que estas carpetas tengan un nombre claro
media_folder: "assets" 
public_folder: "/assets"

site_url: https://colosmica-web.pages.dev

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "home"
        label: "Página Principal"
        file: "index.html"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Texto", name: "body", widget: "markdown"}
